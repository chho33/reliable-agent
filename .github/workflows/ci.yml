name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Offline tests only: no API keys are configured. langgraph is installed via the
      # project dependencies, so tests/test_langgraph.py runs against the real library here.
      - run: python -m pytest -q
